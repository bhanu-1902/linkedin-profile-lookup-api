# Render Blueprint. See README "Deploying" for the manual-setup alternative.
services:
  - type: web
    name: profile-lookup-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: PROFILE_SOURCE
        value: fixture
      - key: RATELIMIT_CAPACITY
        value: "20"
      - key: RATELIMIT_REFILL_SECONDS
        value: "60"
      # Live deploy: set PROFILE_SOURCE=linkedin and secret LINKEDIN_* vars in the dashboard.
    healthCheckPath: /actuator/health
