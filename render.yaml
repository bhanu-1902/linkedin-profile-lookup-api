# Render Blueprint. Set LINKEDIN_* secrets in the dashboard — never in this file.
services:
  - type: web
    name: profile-lookup-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: PROFILE_SOURCE
        value: linkedin
      - key: RATELIMIT_CAPACITY
        value: "20"
      - key: RATELIMIT_REFILL_SECONDS
        value: "60"
      # Dashboard secrets (sync: false so they are not stored in git):
      # LINKEDIN_SESSION_COOKIE, LINKEDIN_PROFILE_URL_TEMPLATE, optional LINKEDIN_CSRF_TOKEN
    healthCheckPath: /actuator/health
