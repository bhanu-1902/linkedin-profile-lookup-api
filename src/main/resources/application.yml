spring:
  application:
    name: profile-lookup-api
  jackson:
    # A missing field (e.g. an in-progress role's endDate, or a section
    # the source data doesn't have) is omitted from the response body
    # entirely, not serialized as null or "". Matches spec.md, "Known
    # profile returned": "omitting any field that is not present."
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}

profile:
  # fixture (default) or stub -- see ProfileSourceConfig
  source: ${PROFILE_SOURCE:fixture}
  fixture-path: classpath:fixtures/sample-profiles.json

linkedin:
  profile-url-template: ${LINKEDIN_PROFILE_URL_TEMPLATE:}
  session-cookie: ${LINKEDIN_SESSION_COOKIE:}
  csrf-token: ${LINKEDIN_CSRF_TOKEN:}
  user-agent: ${LINKEDIN_USER_AGENT:Mozilla/5.0}
  timeout-ms: ${LINKEDIN_TIMEOUT_MS:8000}

ratelimit:
  capacity: ${RATELIMIT_CAPACITY:20}
  refill-period-seconds: ${RATELIMIT_REFILL_SECONDS:60}

springdoc:
  swagger-ui:
    path: /docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
