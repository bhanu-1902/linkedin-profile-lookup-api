spring:
  application:
    name: profile-lookup-api
  jackson:
    # A missing field (e.g. an in-progress role's endDate, or a section
    # the source data doesn't have) is omitted from the response body
    # entirely, not serialized as null or "". Matches spec.md, "Known
    # profile returned": "omitting any field that is not present."
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}

profile:
  # fixture (default), stub, or oidc -- see ProfileSourceConfig
  source: ${PROFILE_SOURCE:fixture}
  fixture-path: classpath:fixtures/sample-profiles.json
  # Comma-separated. Set via env var in real deployments -- never commit
  # real keys. See .env.example.
  api-keys: ${PROFILE_API_KEYS:demo-key-change-me}

linkedin:
  # Only required when profile.source=oidc -- see LinkedInOidcConfig,
  # which fails fast at startup if oidc mode is selected and any of
  # these are blank. See .env.example.
  client-id: ${LINKEDIN_CLIENT_ID:}
  client-secret: ${LINKEDIN_CLIENT_SECRET:}
  redirect-uri: ${LINKEDIN_REDIRECT_URI:}

ratelimit:
  capacity: ${RATELIMIT_CAPACITY:20}
  refill-period-seconds: ${RATELIMIT_REFILL_SECONDS:60}

springdoc:
  swagger-ui:
    path: /docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
